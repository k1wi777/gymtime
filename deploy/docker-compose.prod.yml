# Production stack: PostgreSQL + API + panel + Caddy (HTTPS and WebSocket wss).
# EXAMPLE: adapt the domains and the images to your provider (docs/despliegue.md).
#
#   cp .env.production.example .env.production      # fill every value
#   cp Caddyfile.example Caddyfile                  # your domain
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# Only Caddy publishes ports; PostgreSQL, the API and the panel stay on the
# internal network. The panel image is built PER ENVIRONMENT because
# NEXT_PUBLIC_API_URL is baked into it:
#   docker build --build-arg NEXT_PUBLIC_API_URL=https://api.<domain> -f web/Dockerfile -t gymtime-web web
name: gymtime-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: ${SERVER_IMAGE:-gymtime-server:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TRUST_PROXY: '1'
    # Optional official consent text (CONSENT_FILE=/config/consentimiento.json):
    # volumes:
    #   - ./consentimiento.json:/config/consentimiento.json:ro

  web:
    image: ${WEB_IMAGE:-gymtime-web:latest}
    restart: unless-stopped
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
